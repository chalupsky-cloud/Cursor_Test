<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>连通测试</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #6b645c;
      --line: #e4ddd4;
      --paper: #f6f1ea;
      --card: #fffdf9;
      --stamp: #9c3b2e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", "Noto Serif SC", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(156, 59, 46, 0.08), transparent 28%),
        var(--paper);
    }

    main {
      width: min(640px, calc(100% - 32px));
      margin: 0 auto;
      padding: 72px 0 48px;
    }

    p { line-height: 1.7; }

    .eyebrow {
      margin: 0 0 12px;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--stamp);
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 8vw, 64px);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .lead {
      max-width: 36em;
      margin: 20px 0 0;
      font-size: 18px;
      color: var(--muted);
    }

    .card {
      margin-top: 36px;
      padding: 8px 0 4px;
      border-top: 1px solid var(--line);
    }

    dl {
      margin: 0;
    }

    .row {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    dt {
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 13px;
      color: var(--muted);
    }

    dd {
      margin: 0;
      font-size: 16px;
    }

    a {
      color: inherit;
    }

    footer {
      margin-top: 28px;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      main { padding-top: 40px; }
      .row { grid-template-columns: 1fr; gap: 4px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Cursor Test</p>
    <h1>连通测试</h1>
    <p class="lead">这是一个提交到 GitHub 的简单页面，用来确认仓库写入是否成功。打开这个文件就能看到结果，不需要安装依赖。</p>
    <section class="card" aria-label="提交信息">
      <dl>
        <div class="row">
          <dt>仓库</dt>
          <dd><a href="https://github.com/chalupsky-cloud/Cursor_Test">chalupsky-cloud/Cursor_Test</a></dd>
        </div>
        <div class="row">
          <dt>文件</dt>
          <dd>index.html</dd>
        </div>
        <div class="row">
          <dt>状态</dt>
          <dd>已放在仓库根目录，可直接打开。</dd>
        </div>
      </dl>
    </section>
    <footer>2026年10月8日</footer>
  </main>
</body>
</html>
